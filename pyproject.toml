[project]
name = "vaultkit"
version = "0.1.0"
description = "Notes for an Obsidian vault that is also an Open Knowledge Format bundle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18"]

[project.scripts]
vaultkit = "vaultkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
